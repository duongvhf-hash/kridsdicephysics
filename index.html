<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>3D Dice</title>

	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
			font-family: Arial, Helvetica, sans-serif;
		}

		body {
			user-select: none;
		}

		#app {
			position: relative;
			width: 100%;
			height: 100%;
			background: #000;
		}

		canvas {
			display: block;
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			cursor: grab;
			touch-action: none;
		}

		canvas.dragging {
			cursor: grabbing;
		}

		#top {
			position: absolute;
			top: 18px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			gap: 5px;
			padding: 6px;
			border-radius: 13px;
			background: rgba(0,0,0,.42);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			z-index: 10;
		}

		.diceButton {
			width: 39px;
			height: 36px;
			border: 0;
			border-radius: 9px;
			background: rgba(255,255,255,.08);
			color: rgba(255,255,255,.65);
			font-size: 14px;
			font-weight: 700;
			cursor: pointer;
		}

		.diceButton:hover {
			background: rgba(255,255,255,.14);
			color: #fff;
		}

		.diceButton.active {
			background: #fff;
			color: #111;
		}

		#result {
			position: absolute;
			top: 69px;
			left: 50%;
			transform: translateX(-50%);
			padding: 7px 13px;
			border-radius: 9px;
			background: rgba(0,0,0,.35);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			color: #fff;
			font-size: 15px;
			font-weight: 700;
			pointer-events: none;
			white-space: nowrap;
			z-index: 10;
		}

		#roll {
			position: absolute;
			left: 50%;
			bottom: 25px;
			transform: translateX(-50%);
			height: 49px;
			padding: 0 31px;
			border: 0;
			border-radius: 13px;
			background: #fff;
			color: #111;
			font-size: 15px;
			font-weight: 800;
			cursor: pointer;
			box-shadow: 0 8px 28px rgba(0,0,0,.5);
			transition: transform .12s, opacity .12s;
			z-index: 10;
		}

		#roll:hover {
			transform: translateX(-50%) scale(1.03);
		}

		#roll:active {
			transform: translateX(-50%) scale(.97);
		}

		#roll:disabled {
			opacity: .5;
			cursor: default;
		}

		#audio {
			position: absolute;
			right: 16px;
			bottom: 16px;
			width: 43px;
			height: 43px;
			border: 1px solid rgba(255,255,255,.12);
			border-radius: 11px;
			background: rgba(0,0,0,.38);
			color: #fff;
			font-size: 17px;
			cursor: pointer;
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			z-index: 10;
		}

		#settingsButton {
			position: absolute;
			right: 16px;
			bottom: 68px;
			width: 43px;
			height: 43px;
			border: 1px solid rgba(255,255,255,.12);
			border-radius: 11px;
			background: rgba(0,0,0,.38);
			color: #fff;
			font-size: 18px;
			cursor: pointer;
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			z-index: 10;
		}

		#settings {
			position: absolute;
			right: 16px;
			bottom: 120px;
			width: 225px;
			padding: 15px;
			border: 1px solid rgba(255,255,255,.12);
			border-radius: 14px;
			background: rgba(10,10,10,.84);
			backdrop-filter: blur(15px);
			-webkit-backdrop-filter: blur(15px);
			box-shadow: 0 12px 35px rgba(0,0,0,.45);
			color: #fff;
			z-index: 20;
			display: none;
		}

		#settings.open {
			display: block;
		}

		.settingsTitle {
			margin-bottom: 13px;
			font-size: 15px;
			font-weight: 800;
		}

		.settingGroup {
			margin-bottom: 15px;
		}

		.settingGroup:last-child {
			margin-bottom: 0;
		}

		.settingLabel {
			display: block;
			margin-bottom: 7px;
			color: rgba(255,255,255,.55);
			font-size: 11px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: .6px;
		}

		#sfxSelect {
			width: 100%;
			height: 38px;
			border: 1px solid rgba(255,255,255,.13);
			border-radius: 9px;
			padding: 0 10px;
			background: #171717;
			color: #fff;
			outline: none;
		}

		#controls {
			position: absolute;
			left: 15px;
			bottom: 15px;
			padding: 7px 10px;
			border-radius: 9px;
			background: rgba(0,0,0,.32);
			color: rgba(255,255,255,.45);
			font-size: 11px;
			pointer-events: none;
			z-index: 10;
		}

		@media(max-width:650px) {
			#top {
				top: 9px;
			}

			.diceButton {
				width: 34px;
				height: 32px;
			}

			#result {
				top: 59px;
				font-size: 14px;
			}

			#controls {
				display: none;
			}

			#settings {
				right: 10px;
				bottom: 120px;
			}
		}
	</style>
</head>

<body>

	<div id="app">

		<canvas id="canvas"></canvas>

		<div id="top">
			<button class="diceButton active" data-count="1">1</button>
			<button class="diceButton" data-count="2">2</button>
			<button class="diceButton" data-count="3">3</button>
			<button class="diceButton" data-count="4">4</button>
			<button class="diceButton" data-count="5">5</button>
			<button class="diceButton" data-count="6">6</button>
		</div>

		<div id="result">Ready</div>

		<div id="controls">
			Drag = Look Around • Wheel = Zoom
		</div>

		<div id="settings">

			<div class="settingsTitle">
				Settings
			</div>

			<div class="settingGroup">
				<label class="settingLabel" for="sfxSelect">
					Hit SFX
				</label>

				<select id="sfxSelect">
					<option value="hard">Hard</option>
					<option value="wood">Wood</option>
					<option value="soft">Soft</option>
					<option value="glassy">Glassy</option>
					<option value="kick">Kick</option>
					<option value="arcade">Arcade</option>
					<option value="sonar">Sonar</option>
				</select>
			</div>

		</div>

		<button id="settingsButton">⚙</button>
		<button id="roll">ROLL</button>
		<button id="audio">🔊</button>

	</div>

	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
		}
	}
	</script>

	<script type="module">

		import * as THREE from "three";

		import {
			RoundedBoxGeometry
		} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/geometries/RoundedBoxGeometry.js";

		import {
			Reflector
		} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/objects/Reflector.js";

		import * as CANNON from "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm";


		const canvas =
			document.getElementById("canvas");

		const result =
			document.getElementById("result");

		const rollButton =
			document.getElementById("roll");

		const audioButton =
			document.getElementById("audio");

		const settingsButton =
			document.getElementById(
				"settingsButton"
			);

		const settings =
			document.getElementById(
				"settings"
			);

		const sfxSelect =
			document.getElementById(
				"sfxSelect"
			);

		const diceButtons =
			document.querySelectorAll(
				".diceButton"
			);


		const PLATFORM_SIZE = 12;
		const PLATFORM_HEIGHT = .28;
		const DIE_SIZE = 1.1;
		const WALL_THICKNESS = .20;
		const WALL_HEIGHT = 1.8;


		let hitSfx = "hard";


		const renderer =
			new THREE.WebGLRenderer({
				canvas,
				antialias: true,
				powerPreference:
					"high-performance"
			});


		renderer.setPixelRatio(
			Math.min(
				window.devicePixelRatio,
				2
			)
		);

		renderer.outputColorSpace =
			THREE.SRGBColorSpace;

		renderer.toneMapping =
			THREE.ACESFilmicToneMapping;

		renderer.toneMappingExposure =
			1.16;

		renderer.shadowMap.enabled =
			true;

		renderer.shadowMap.type =
			THREE.PCFSoftShadowMap;


		const scene =
			new THREE.Scene();

		scene.background =
			new THREE.Color(
				0x010101
			);

		scene.fog =
			new THREE.FogExp2(
				0x010101,
				0.024
			);


		const camera =
			new THREE.PerspectiveCamera(
				44,
				window.innerWidth /
					window.innerHeight,
				.05,
				100
			);


		const cameraTarget =
			new THREE.Vector3(
				0,
				.55,
				0
			);


		let cameraRadius = 8.2;

		const MIN_CAMERA_RADIUS = 4.2;
		const MAX_CAMERA_RADIUS = 15;

		let cameraYaw = 0;
		let cameraPitch = .47;

		let dragging = false;

		let mouseX = 0;
		let mouseY = 0;

		const activePointers =
			new Map();


		function updateCamera() {

			cameraPitch =
				Math.max(
					.05,
					Math.min(
						1.25,
						cameraPitch
					)
				);


			const horizontalRadius =
				Math.cos(
					cameraPitch
				) *
				cameraRadius;


			const x =
				Math.sin(
					cameraYaw
				) *
				horizontalRadius;


			const y =
				Math.sin(
					cameraPitch
				) *
				cameraRadius;


			const z =
				Math.cos(
					cameraYaw
				) *
				horizontalRadius;


			camera.position.set(
				cameraTarget.x + x,
				cameraTarget.y + y,
				cameraTarget.z + z
			);


			camera.lookAt(
				cameraTarget
			);
		}


		function beginDrag(event) {

			activePointers.set(
				event.pointerId,
				{
					x: event.clientX,
					y: event.clientY
				}
			);


			if (
				activePointers.size === 1
			) {

				dragging = true;

				canvas.classList.add(
					"dragging"
				);

				mouseX =
					event.clientX;

				mouseY =
					event.clientY;

			} else {

				dragging = false;

				canvas.classList.remove(
					"dragging"
				);

			}


			try {
				canvas.setPointerCapture(
					event.pointerId
				);
			} catch {}


			unlockAudio();

			event.preventDefault();
		}


		function endDrag(event) {

			activePointers.delete(
				event.pointerId
			);


			if (
				activePointers.size === 1
			) {

				const remaining =
					activePointers.values()
						.next()
						.value;

				dragging = true;

				mouseX =
					remaining.x;

				mouseY =
					remaining.y;

				canvas.classList.add(
					"dragging"
				);

			} else {

				dragging = false;

				canvas.classList.remove(
					"dragging"
				);

			}


			try {

				if (
					event &&
					event.pointerId !==
					undefined
				) {

					canvas.releasePointerCapture(
						event.pointerId
					);

				}

			} catch {}
		}


		canvas.addEventListener(
			"pointerdown",
			beginDrag
		);


		canvas.addEventListener(
			"pointerup",
			endDrag
		);


		canvas.addEventListener(
			"pointercancel",
			endDrag
		);


		canvas.addEventListener(
			"lostpointercapture",
			event => {

				activePointers.delete(
					event.pointerId
				);

				if (
					activePointers.size ===
					1
				) {

					const remaining =
						activePointers.values()
							.next()
							.value;

					dragging = true;

					mouseX =
						remaining.x;

					mouseY =
						remaining.y;

					canvas.classList.add(
						"dragging"
					);

				} else {

					dragging = false;

					canvas.classList.remove(
						"dragging"
					);

				}

			}
		);


		window.addEventListener(
			"pointerup",
			endDrag
		);


		window.addEventListener(
			"pointercancel",
			endDrag
		);


		window.addEventListener(
			"pointermove",
			event => {

				const pointer =
					activePointers.get(
						event.pointerId
					);


				if (!pointer) {
					return;
				}


				if (
					activePointers.size >= 2
				) {

					const oldPointers =
						[...activePointers.values()];


					const oldCenterY =
						oldPointers.reduce(
							(sum, point) =>
								sum +
								point.y,
							0
						) /
						oldPointers.length;


					pointer.x =
						event.clientX;

					pointer.y =
						event.clientY;


					const newPointers =
						[...activePointers.values()];


					const newCenterY =
						newPointers.reduce(
							(sum, point) =>
								sum +
								point.y,
							0
						) /
						newPointers.length;


					const deltaY =
						newCenterY -
						oldCenterY;


					cameraRadius +=
						deltaY *
						.022;


					cameraRadius =
						Math.max(
							MIN_CAMERA_RADIUS,
							Math.min(
								MAX_CAMERA_RADIUS,
								cameraRadius
							)
						);


					updateCamera();

					event.preventDefault();

					return;

				}


				if (
					!dragging
				) {
					return;
				}


				const dx =
					event.clientX -
					mouseX;

				const dy =
					event.clientY -
					mouseY;


				pointer.x =
					event.clientX;

				pointer.y =
					event.clientY;


				mouseX =
					event.clientX;

				mouseY =
					event.clientY;


				cameraYaw -=
					dx * .004;

				cameraPitch +=
					dy * .004;


				cameraPitch =
					Math.max(
						.05,
						Math.min(
							1.25,
							cameraPitch
						)
					);

			}
		);


		canvas.addEventListener(
			"wheel",
			event => {

				event.preventDefault();


				cameraRadius +=
					event.deltaY *
					.008;


				cameraRadius =
					Math.max(
						MIN_CAMERA_RADIUS,
						Math.min(
							MAX_CAMERA_RADIUS,
							cameraRadius
						)
					);


				updateCamera();

			},
			{
				passive: false
			}
		);


		const hemisphere =
			new THREE.HemisphereLight(
				0xffffff,
				0x080808,
				1.9
			);

		scene.add(
			hemisphere
		);


		const mainLight =
			new THREE.DirectionalLight(
				0xffffff,
				4.4
			);


		mainLight.position.set(
			-4.5,
			8,
			5
		);


		mainLight.castShadow = true;

		mainLight.shadow.mapSize.width =
			2048;

		mainLight.shadow.mapSize.height =
			2048;

		mainLight.shadow.camera.left =
			-12;

		mainLight.shadow.camera.right =
			12;

		mainLight.shadow.camera.top =
			12;

		mainLight.shadow.camera.bottom =
			-12;

		mainLight.shadow.bias =
			-.0002;


		scene.add(
			mainLight
		);


		const softLight =
			new THREE.PointLight(
				0xffffff,
				14,
				26
			);


		softLight.position.set(
			4,
			5,
			-4
		);


		scene.add(
			softLight
		);


		const platform =
			new THREE.Mesh(

				new THREE.BoxGeometry(
					PLATFORM_SIZE,
					PLATFORM_HEIGHT,
					PLATFORM_SIZE
				),

				new THREE.MeshStandardMaterial({
					color: 0x202020,
					roughness: .40,
					metalness: .13
				})

			);


		platform.position.y =
			-PLATFORM_HEIGHT / 2;


		platform.castShadow = true;
		platform.receiveShadow = true;


		scene.add(
			platform
		);


		const lowerPlatform =
			new THREE.Mesh(

				new THREE.BoxGeometry(
					PLATFORM_SIZE + .08,
					.13,
					PLATFORM_SIZE + .08
				),

				new THREE.MeshStandardMaterial({
					color: 0x0c0c0c,
					roughness: .58,
					metalness: .08
				})

			);


		lowerPlatform.position.y =
			-.34;


		lowerPlatform.castShadow =
			true;

		lowerPlatform.receiveShadow =
			true;


		scene.add(
			lowerPlatform
		);


		const reflection =
			new Reflector(

				new THREE.PlaneGeometry(
					PLATFORM_SIZE - .04,
					PLATFORM_SIZE - .04
				),

				{
					clipBias: .003,

					textureWidth:
						Math.min(
							window.innerWidth *
								window.devicePixelRatio,
							2048
						),

					textureHeight:
						Math.min(
							window.innerHeight *
								window.devicePixelRatio,
							2048
						),

					color:
						new THREE.Color(
							0x151515
						)
				}

			);


		reflection.rotation.x =
			-Math.PI / 2;

		reflection.position.y =
			.003;

		reflection.renderOrder =
			1;


		scene.add(
			reflection
		);


		function createGrid() {

			const size =
				PLATFORM_SIZE - .16;

			const half =
				size / 2;

			const spacing = .5;

			const positions = [];

			const count =
				Math.floor(
					half / spacing
				);


			for (
				let i = -count;
				i <= count;
				i++
			) {

				const p =
					i * spacing;


				positions.push(
					p,
					.011,
					-half,

					p,
					.011,
					half
				);


				positions.push(
					-half,
					.011,
					p,

					half,
					.011,
					p
				);

			}


			const geometry =
				new THREE.BufferGeometry();


			geometry.setAttribute(
				"position",

				new THREE.Float32BufferAttribute(
					positions,
					3
				)
			);


			const material =
				new THREE.LineBasicMaterial({
					color: 0x2d2d2d,
					transparent: true,
					opacity: .7
				});


			const grid =
				new THREE.LineSegments(
					geometry,
					material
				);


			grid.renderOrder =
				2;


			scene.add(
				grid
			);
		}


		createGrid();


		function createWhiteOutline() {

			const half =
				(PLATFORM_SIZE - .10) /
				2;


			const geometry =
				new THREE.BufferGeometry();


			const positions =
				new Float32Array([

					-half, .020, -half,
					half, .020, -half,

					half, .020, -half,
					half, .020, half,

					half, .020, half,
					-half, .020, half,

					-half, .020, half,
					-half, .020, -half

				]);


			geometry.setAttribute(
				"position",

				new THREE.BufferAttribute(
					positions,
					3
				)
			);


			const material =
				new THREE.LineBasicMaterial({
					color: 0xffffff,
					transparent: true,
					opacity: .92
				});


			const outline =
				new THREE.LineSegments(
					geometry,
					material
				);


			outline.renderOrder =
				3;


			scene.add(
				outline
			);
		}


		createWhiteOutline();


		const world =
			new CANNON.World({

				gravity:
					new CANNON.Vec3(
						0,
						-24,
						0
					)

			});


		world.allowSleep = true;

		world.solver.iterations =
			18;

		world.solver.tolerance =
			.001;


		const groundMaterial =
			new CANNON.Material(
				"ground"
			);


		const diceMaterial =
			new CANNON.Material(
				"dice"
			);


		const wallMaterial =
			new CANNON.Material(
				"wall"
			);


		world.addContactMaterial(

			new CANNON.ContactMaterial(
				groundMaterial,
				diceMaterial,
				{
					friction: .56,
					restitution: .38,
					contactEquationStiffness:
						1e7,
					contactEquationRelaxation:
						3
				}
			)

		);


		world.addContactMaterial(

			new CANNON.ContactMaterial(
				diceMaterial,
				diceMaterial,
				{
					friction: .49,
					restitution: .32,
					contactEquationStiffness:
						1e7,
					contactEquationRelaxation:
						3
				}
			)

		);


		world.addContactMaterial(

			new CANNON.ContactMaterial(
				wallMaterial,
				diceMaterial,
				{

					Math.random() *
					Math.PI *
					2

				);


				die.body.wakeUp();

			}


			for (
				const die of dice
			) {

				const angle =
					Math.random() *
					Math.PI *
					2;


				const speed =
					3.2 +
					Math.random() *
					3.2;


				die.body.velocity.set(

					Math.cos(angle) *
					speed,

					3.5 +
					Math.random() *
					2.5,

					Math.sin(angle) *
					speed

				);


				die.body.angularVelocity.set(

					(Math.random() - .5) *
					27,

					(Math.random() - .5) *
					27,

					(Math.random() - .5) *
					27

				);

			}

		}


		let rolling = false;

		let stillTime = 0;

		let rollElapsed = 0;

		let lastTime =
			performance.now();


		const MIN_ROLL_TIME =
			1.35;

		const SETTLE_TIME =
			.95;

		const LINEAR_STOP =
			.055;

		const ANGULAR_STOP =
			.12;


		function allDiceSettled() {

			for (
				const die of dice
			) {

				const velocity =
					die.body.velocity
						.length();


				const angular =
					die.body.angularVelocity
						.length();


				if (
					velocity >
					LINEAR_STOP ||

					angular >
					ANGULAR_STOP
				) {

					return false;

				}

			}


			return true;
		}


		function finishRoll() {

			rolling = false;

			stillTime = 0;

			rollElapsed = 0;

			rollButton.disabled =
				false;


			const values =
				dice.map(
					die =>
						getTopFace(
							die.body
						)
				);


			if (
				values.length === 1
			) {

				result.textContent =
					"Rolled " +
					values[0];

			} else {

				result.textContent =
					"Rolled " +
					values.join(
						"  •  "
					);

			}

		}


		function roll() {

			if (rolling) {
				return;
			}


			unlockAudio();


			rolling = true;

			stillTime = 0;

			rollElapsed = 0;


			rollButton.disabled =
				true;


			result.textContent =
				"Rolling...";


			throwDice();

		}


		for (
			const button of
			diceButtons
		) {

			button.addEventListener(
				"click",
				() => {

					if (rolling) {
						return;
					}


					unlockAudio();


					diceCount =
						Number(
							button.dataset
								.count
						);


					for (
						const b of
						diceButtons
					) {

						b.classList.remove(
							"active"
						);

					}


					button.classList.add(
						"active"
					);


					result.textContent =
						"Ready";


					resetDice();

				}
			);

		}


		rollButton.addEventListener(
			"click",
			() => {

				if (rolling) {
					return;
				}


				roll();

			}
		);


		audioButton.addEventListener(
			"click",
			() => {

				audioEnabled =
					!audioEnabled;


				audioButton.textContent =
					audioEnabled
						? "🔊"
						: "🔇";


				if (audioEnabled) {
					unlockAudio();
				}

			}
		);


		settingsButton.addEventListener(
			"click",
			event => {

				event.stopPropagation();


				settings.classList.toggle(
					"open"
				);

			}
		);


		settings.addEventListener(
			"pointerdown",
			event => {

				event.stopPropagation();

			}
		);


		settings.addEventListener(
			"pointermove",
			event => {

				event.stopPropagation();

			}
		);


		sfxSelect.addEventListener(
			"change",
			() => {

				hitSfx =
					sfxSelect.value;

			}
		);


		function resize() {

			renderer.setSize(
				window.innerWidth,
				window.innerHeight,
				false
			);


			camera.aspect =
				window.innerWidth /
				window.innerHeight;


			camera.updateProjectionMatrix();

		}


		window.addEventListener(
			"resize",
			resize
		);


		resize();


		function animate(time) {

			requestAnimationFrame(
				animate
			);


			const dt =
				Math.min(
					.033,
					(time - lastTime) /
					1000
				);


			lastTime = time;


			world.step(
				1 / 60,
				dt,
				3
			);


			for (
				const die of dice
			) {

				die.mesh.position.copy(
					die.body.position
				);

				die.mesh.quaternion.copy(
					die.body.quaternion
				);

			}


			if (rolling) {

				rollElapsed += dt;


				if (
					rollElapsed >=
					MIN_ROLL_TIME &&

					allDiceSettled()
				) {

					stillTime +=
						dt;

				} else {

					stillTime = 0;

				}


				if (
					stillTime >=
					SETTLE_TIME
				) {

					finishRoll();

				}

			}


			updateCamera();


			renderer.render(
				scene,
				camera
			);

		}


		resetDice();

		updateCamera();

		animate(
			performance.now()
		);

	</script>

</body>
</html>
